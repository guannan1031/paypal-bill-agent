# Render Blueprint: push-to-deploy (render.yaml at repo root)
services:
  - type: web
    name: paypal-bill-agent
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python deploy_run.py"
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_BILL_API_KEY
        sync: false
